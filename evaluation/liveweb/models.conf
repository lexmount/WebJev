# One row per decision model. run_eval.sh evaluates every row (or the rows named in MODELS=a,b).
#
# name            label in reports and name of the result directory
# decision_url    self-hosted WebJev: the server from evaluation/serving (it serves POST /api/alpha/decisions);
#                 Jev: https://openrouter.ai/api/v1 (OpenRouter) or https://api.typesafe.ai (TypeSafe's API)
# decision_model  sent as "model" in every decision request (the self-hosted server ignores it)
# key_env         name of the .env variable holding the endpoint's key, or - for none
# workers         parallel episodes = parallel browsers. For a self-hosted model on one GPU, more workers than the
#                 GPU can serve only add queueing latency; the reported runs used 10 episodes per GPU server on
#                 Lexmount Browser. With BROWSER=local all episodes share one Chrome, and the runner caps them at
#                 LOCAL_CHROME_WORKERS (default 2).
#
# name             decision_url                   decision_model               key_env             workers
